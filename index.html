<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planilla del partido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#31A1DB;
    --blue-dark:#1E7BAB;
    --blue-soft:#E6F4FB;
    --ink:#0D0D0D;
    --slate:#3A3F44;
    --slate-2:#5C646B;
    --line:#D9DEE2;
    --bg:#F2F5F7;
    --white:#FFFFFF;
    --green:#1FA85B;
    --green-soft:#E4F6EC;
    --yellow:#F5C518;
    --yellow-soft:#FEF6DA;
    --red:#D6303A;
    --red-soft:#FCE9EA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:18px 14px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:540px; margin:0 auto;}

  /* ===== HEADER ===== */
  .head{
    background:var(--ink);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 22px -12px rgba(0,0,0,.45);
  }
  .head-top{
    background:var(--blue);
    padding:16px 18px 14px;
    position:relative;
  }
  .crest{
    position:absolute; top:12px; right:14px;
    width:62px; height:62px; border-radius:12px;
    background:var(--white); border:1px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:4px; box-shadow:0 3px 8px rgba(0,0,0,.18);
  }
  .crest img{width:100%; height:100%; object-fit:contain; display:block; border-radius:8px;}
  .head-top .cond-display{padding-right:74px;}
  .cond-label{
    font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(255,255,255,.85); font-weight:700; margin-bottom:8px;
  }
  .cond-display{
    font-family:'Barlow Condensed',sans-serif;
    font-size:38px; line-height:1; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; color:var(--white);
  }
  .head-body{padding:16px 18px 18px;}
  .field-row{
    display:flex; align-items:baseline; gap:10px;
    padding:9px 0; border-bottom:1px solid rgba(255,255,255,.12);
  }
  .field-row:last-of-type{border-bottom:none;}
  .fl{
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--blue); font-weight:700; min-width:74px; flex-shrink:0;
  }
  .fv{color:var(--white); font-size:15px; font-weight:500; line-height:1.35; word-break:break-word;}
  .fv.empty{color:#7A828A; font-weight:400; font-style:italic;}

  .edit-btn{
    display:block; width:100%; margin-top:14px;
    background:transparent; border:1px solid rgba(255,255,255,.28);
    color:var(--white); padding:9px; border-radius:9px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .edit-btn:hover{background:rgba(255,255,255,.08);}
  .btn-pair{display:flex; gap:8px; margin-top:14px;}
  .btn-pair .edit-btn{margin-top:0; flex:1; padding:9px 4px; font-size:12.5px;}
  .edit-btn.nuevo{border-color:var(--yellow); color:var(--yellow);}
  .edit-btn.nuevo:hover{background:rgba(245,197,24,.12);}
  .edit-btn.danger{border-color:var(--red); background:var(--red); color:var(--white);}
  .edit-btn.danger:hover{background:#B8262F;}
  .confirm-nuevo{
    margin-top:12px; padding:12px; border-radius:9px;
    background:rgba(214,48,58,.12); border:1px solid rgba(214,48,58,.4);
  }
  .cn-text{font-size:12.5px; color:var(--white); line-height:1.45;}

  .eform{margin-top:14px; display:flex; flex-direction:column; gap:12px;}
  .eform label{
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--blue); font-weight:700; display:block; margin-bottom:5px;
  }
  .eform input{
    width:100%; padding:10px 11px; border-radius:8px;
    border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.07);
    color:var(--white); font-size:15px; font-family:inherit;
  }
  .eform input::placeholder{color:#6E767D;}
  .eform-row{display:flex; gap:10px;}
  .eform-row > div{flex:1; min-width:0;}
  .seg{display:flex; gap:8px;}
  .seg button{
    flex:1; padding:11px 6px; border-radius:8px; cursor:pointer;
    font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:700;
    letter-spacing:.05em; text-transform:uppercase;
    background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.22);
    color:rgba(255,255,255,.65);
  }
  .seg button.on{background:var(--blue); border-color:var(--blue); color:var(--white);}
  .save-btn{
    background:var(--yellow); color:var(--ink); border:none; padding:12px;
    border-radius:9px; font-weight:800; font-size:14.5px; cursor:pointer; font-family:inherit;
  }

  /* ===== TABS ===== */
  .tabs{display:flex; gap:8px; margin:16px 0 14px;}
  .tab{
    flex:1; padding:11px 6px; border-radius:9px; cursor:pointer;
    font-size:13.5px; font-weight:700; font-family:inherit;
    background:var(--white); border:1.5px solid var(--line); color:var(--slate-2);
  }
  .tab.active{background:var(--ink); border-color:var(--ink); color:var(--white);}

  /* ===== CARDS ===== */
  .card{
    background:var(--white); border-radius:14px; padding:18px;
    margin-bottom:12px; border:1px solid var(--line);
  }
  .card h3{
    margin:0 0 14px; font-size:11.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--slate-2); font-weight:700;
  }
  select,.textinput{
    width:100%; padding:12px; border-radius:9px; border:1.5px solid var(--line);
    font-size:15px; font-family:inherit; background:var(--white); color:var(--ink);
  }
  select:focus,.textinput:focus{outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue);}
  .hint{font-size:12.5px; color:var(--slate-2); line-height:1.45;}
  .linkish{color:var(--blue); text-decoration:underline; cursor:pointer; font-weight:600;}

  .greet{font-size:20px; font-weight:800; margin:0 0 2px;}
  .greet small{display:block; font-size:12.5px; font-weight:500; color:var(--slate-2); margin-top:2px;}

  .choice-row{display:flex; gap:10px; margin-top:16px;}
  .choice-btn{
    flex:1; padding:16px 8px; border-radius:11px; cursor:pointer; font-family:inherit;
    border:2px solid var(--line); background:var(--white); color:var(--slate);
    font-weight:800; font-size:15px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .choice-btn .ic{font-size:21px; line-height:1;}
  .choice-btn.on-va{border-color:var(--green); background:var(--green-soft); color:var(--green);}
  .choice-btn.on-no{border-color:var(--red); background:var(--red-soft); color:var(--red);}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .chip{
    padding:10px 15px; border-radius:22px; cursor:pointer; font-family:inherit;
    border:1.5px solid var(--line); background:var(--white);
    font-size:13.5px; font-weight:600; color:var(--slate);
  }
  .chip.on{background:var(--red); border-color:var(--red); color:var(--white);}

  .btn-primary{
    width:100%; margin-top:16px; padding:14px; border:none; border-radius:10px;
    background:var(--blue); color:var(--white); font-weight:800; font-size:15px;
    cursor:pointer; font-family:inherit;
  }
  .btn-primary:disabled{background:var(--line); color:#9AA1A7; cursor:not-allowed;}
  .btn-primary:not(:disabled):hover{background:var(--blue-dark);}

  .banner{
    margin-top:14px; padding:13px 14px; border-radius:10px;
    font-size:13.5px; font-weight:700; line-height:1.4;
  }
  .btn-danger{
    width:100%; margin-top:14px; padding:14px; border:none; border-radius:10px;
    background:var(--red); color:var(--white); font-weight:800; font-size:15px;
    cursor:pointer; font-family:inherit;
  }
  .btn-danger:hover{background:#B8262F;}
  .btn-secondary{
    width:100%; margin-top:10px; padding:13px; border-radius:10px;
    background:var(--white); color:var(--ink); border:1.5px solid var(--line);
    font-weight:700; font-size:14.5px; cursor:pointer; font-family:inherit;
  }
  .btn-secondary:hover{border-color:var(--slate-2);}
  .answer-box{
    border-radius:12px; padding:18px 16px; text-align:center; border:2px solid;
  }
  .answer-box.va{background:var(--green-soft); border-color:var(--green);}
  .answer-box.no{background:var(--red-soft); border-color:var(--red);}
  .answer-box .big{
    font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:700;
    line-height:1; text-transform:uppercase; letter-spacing:.03em;
  }
  .answer-box.va .big{color:var(--green);}
  .answer-box.no .big{color:var(--red);}
  .answer-box .sub{font-size:13px; font-weight:600; margin-top:5px; color:var(--slate);}
  .banner.va{background:var(--green-soft); color:var(--green); border:1px solid #B6E3C9;}
  .banner.no{background:var(--red-soft); color:var(--red); border:1px solid #F3BFC2;}

  /* ===== COACH ===== */
  .summary{display:flex; gap:8px; margin-bottom:12px;}
  .sbox{flex:1; border-radius:12px; padding:12px 6px; text-align:center; border:1px solid var(--line);}
  .sbox .n{font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:700; line-height:1; display:block;}
  .sbox .l{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; margin-top:4px; display:block;}
  .sbox.va{background:var(--green); border-color:var(--green); color:var(--white);}
  .sbox.no{background:var(--red); border-color:var(--red); color:var(--white);}
  .sbox.pend{background:var(--white); color:var(--slate-2);}

  .plist{
    display:grid; grid-template-columns:1fr 1fr; gap:6px;
  }
  .prow{
    display:flex; align-items:center; gap:8px; padding:8px 9px;
    border-radius:9px; min-width:0;
    border:1.5px solid var(--line); background:var(--white);
  }
  .prow.va{background:var(--green-soft); border-color:var(--green);}
  .prow.no{background:var(--red-soft); border-color:var(--red);}
  .bar{width:4px; align-self:stretch; border-radius:3px; background:var(--line); flex-shrink:0;}
  .prow.va .bar{background:var(--green);}
  .prow.no .bar{background:var(--red);}
  .pinfo{flex:1; min-width:0;}
  .pnick{
    font-weight:800; font-size:14px; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ptag{
    font-size:10.5px; font-weight:700; line-height:1.25; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .prow .x-btn{align-self:flex-start;}
  @media (max-width:360px){
    .plist{grid-template-columns:1fr;}
  }
  .prow.va .ptag{color:var(--green);}
  .prow.no .ptag{color:var(--red);}
  .prow.pend .ptag{color:#98A0A7;}
  .x-btn{border:none; background:none; color:#B4BBC1; font-size:15px; cursor:pointer; padding:2px 0 2px 4px; line-height:1;}
  .x-btn:hover{color:var(--ink);}

  .add-row{display:flex; gap:8px; margin-top:10px;}
  .add-row input{flex:1; min-width:0;}
  .add-row button{
    padding:0 16px; border:none; border-radius:9px; background:var(--ink);
    color:var(--white); font-weight:700; cursor:pointer; font-family:inherit; font-size:14px;
  }

  /* ===== LOCK ===== */
  .lock{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:26px 20px; text-align:center;}
  .lock .ic{font-size:28px; margin-bottom:8px;}
  .lock h3{margin:0 0 5px; font-size:17px; font-weight:800; letter-spacing:0; text-transform:none; color:var(--ink);}
  .lock p{margin:0 0 16px; font-size:13px; color:var(--slate-2); line-height:1.45;}
  .lock input{
    width:100%; padding:13px; border-radius:9px; border:1.5px solid var(--line);
    font-size:16px; text-align:center; letter-spacing:.1em; font-family:inherit; margin-bottom:10px;
  }
  .err{color:#C0392B; font-size:12.5px; font-weight:700; margin:-3px 0 10px;}
  .ghost{
    margin-top:12px; background:none; border:none; color:var(--slate-2);
    text-decoration:underline; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .foot-link{text-align:center; font-size:12.5px; color:var(--slate-2); text-decoration:underline; cursor:pointer; padding:4px;}
  .passbox{background:var(--bg); border-radius:10px; padding:14px; margin-top:12px;}
  .passbox label{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--slate-2); font-weight:700; display:block; margin-bottom:5px;}
  .passbox input{width:100%; padding:10px; border-radius:8px; border:1.5px solid var(--line); font-size:15px; font-family:inherit; margin-bottom:10px;}
  .passbox .save-btn{width:100%;}

  .loading{text-align:center; padding:70px 0; color:var(--slate-2); font-size:14px;}
  .empty{text-align:center; color:var(--slate-2); padding:18px 0; font-size:13.5px;}
  .warn{
    background:var(--yellow-soft); border:1px solid #EFDFA0; color:#7A5E00;
    border-radius:10px; padding:11px 13px; font-size:12.5px; margin-bottom:12px; line-height:1.45;
  }
</style>
</head>

/* ---------- Firebase Realtime Database ---------- */
const DB_URL = "https://m14-asistencia-default-rtdb.firebaseio.com";

let ONLINE = true;
const mem = {};

function dbPath(key){
  return DB_URL + "/" + encodeURIComponent(key).replace(/%3A/g, "~") + ".json";
}

const store = {
  async get(key){
    if(ONLINE){
      try{
        const res = await fetch(dbPath(key), {cache:'no-store'});
        if(!res.ok) throw new Error('http ' + res.status);
        const val = await res.json();
        if(val !== null && val !== undefined){ mem[key] = val; return val; }
        return null;
      }catch(e){
        console.warn('DB get falló', key, e);
        ONLINE = false;
        state.offline = true;
      }
    }
    return (key in mem) ? mem[key] : null;
  },
  async set(key, value){
    mem[key] = value;
    if(ONLINE){
      try{
        const res = await fetch(dbPath(key), {
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(value)
        });
        if(!res.ok) throw new Error('http ' + res.status);
        return true;
      }catch(e){
        console.warn('DB set falló', key, e);
        ONLINE = false;
        state.offline = true;
      }
    }
    return false;
  },
  // datos propios del dispositivo (quién soy) — no van a la base compartida
  async getMine(key){
    try{ return localStorage.getItem('m14_' + key); }catch(e){ return (key in mem) ? mem[key] : null; }
  },
  async setMine(key, value){
    mem[key] = value;
    try{ localStorage.setItem('m14_' + key, value); }catch(e){}
  }
};

function migrateRoster(list){
  if(!Array.isArray(list)) return null;
  const out = [];
  for(const item of list){
    if(item && typeof item === 'object' && (item.n || item.a)){
      out.push({ n:String(item.n||'').trim(), a:String(item.a||'').trim(), k:String(item.k||'').trim() });
      continue;
    }
    const s = (typeof item === 'string') ? item.trim() : '';
    if(!s) continue;
    const match = DEFAULT_ROSTER.find(d => (d.n+' '+d.a).toLowerCase() === s.toLowerCase());
    if(match){ out.push({...match}); continue; }
    const parts = s.split(/\s+/);
    out.push({ n: parts[0] || s, a: parts.slice(1).join(' '), k:'' });
  }
  return out;
}

function sortRoster(list){
  return list.slice().sort((x, y) => {
    const c = (x.a || '').localeCompare(y.a || '', 'es', {sensitivity:'base'});
    if(c !== 0) return c;
    return (x.n || '').localeCompare(y.n || '', 'es', {sensitivity:'base'});
  });
}

function pid(p){ return (p.n + ' ' + p.a).replace(/\s+/g,' ').trim(); }
function fullName(p){ return (p.n + ' ' + p.a).replace(/\s+/g,' ').trim(); }
function findPlayer(id){ return state.roster.find(p => pid(p) === id); }

function nextSaturdayISO(){
  const d = new Date();
  const add = (6 - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + add);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${dias[dt.getDay()]} ${dt.getDate()} de ${meses[dt.getMonth()]}`;
}

async function loadAll(){
  try{
    let match = await store.get('match');
    if(match && typeof match === 'string'){ try{ match = JSON.parse(match); }catch(e){ match = null; } }
    if(!match || !match.matchId){
      match = { condicion:'LOCAL', lugar:'', participan:'', fecha:nextSaturdayISO(), hora:'', matchId:'m'+Date.now().toString(36) };
      await store.set('match', match);
    }
    state.match = match;

    let roster = await store.get('roster');
    if(roster && typeof roster === 'string'){ try{ roster = JSON.parse(roster); }catch(e){ roster = null; } }
    roster = migrateRoster(roster);
    if(!Array.isArray(roster) || roster.length === 0){
      roster = DEFAULT_ROSTER.map(p => ({...p}));
      await store.set('roster', roster);
    }
    state.roster = sortRoster(roster);

    let resp = await store.get('responses:'+match.matchId);
    if(resp && typeof resp === 'string'){ try{ resp = JSON.parse(resp); }catch(e){ resp = null; } }
    state.responses = (resp && typeof resp === 'object') ? resp : {};

    state.pass = await store.get('coach_pass');
    state.teamPass = await store.get('team_pass');
    state.myId = '';
  }catch(e){
    console.error(e);
    if(!state.match){
      state.match = { condicion:'LOCAL', lugar:'', participan:'', fecha:nextSaturdayISO(), hora:'', matchId:'m0' };
      state.roster = DEFAULT_ROSTER.map(p => ({...p}));
    }
  }
  state.loading = false;
  render();
}

async function saveMatch(nm){
  nm.matchId = state.match ? state.match.matchId : 'm'+Date.now().toString(36);
  state.match = nm;
  await store.set('match', nm);
  state.editing = false;
  render();
}

// arranca un encuentro nuevo: borra las respuestas, conserva plantel y claves
async function nuevoEncuentro(){
  const nm = {
    condicion: state.match.condicion,
    lugar: '',
    participan: '',
    fecha: nextSaturdayISO(),
    hora: '',
    matchId: 'm' + Date.now().toString(36)
  };
  state.match = nm;
  state.responses = {};
  await store.set('match', nm);
  await store.set('responses:' + nm.matchId, {});
  state.confirmNuevo = false;
  state.editing = true;
  render();
}
async function saveRoster(){
  state.roster = sortRoster(state.roster);
  await store.set('roster', state.roster);
}
async function saveResponses(){ await store.set('responses:'+state.match.matchId, state.responses); }

async function submitResponse(){
  if(!state.myId || !state.draft) return;
  state.responses[state.myId] = {
    status: state.draft,
    motivo: state.draft === 'no' ? state.draftMotivo : '',
    ts: Date.now()
  };
  state.editingAnswer = false;
  await saveResponses();
  render();
}

function buildReminder(){
  const m = state.match;
  const pend = state.roster.filter(p => !state.responses[pid(p)]);
  let cab = `${m.condicion}`;
  if(m.lugar) cab += ` en ${m.lugar}`;
  if(m.participan) cab += ` — ${m.participan}`;
  cab += ` · ${fmtDate(m.fecha)}${m.hora ? ', ' + m.hora : ''}`;
  if(pend.length === 0) return `${cab}\n\nYa confirmaron todos 🏉`;
  return `${cab}\n\nTodavía no confirmaron: ${pend.map(p => p.k || fullName(p)).join(', ')}.\nAvisen si van 🙏🏉`;
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}

/* ---------- events ---------- */
function wire(){
  const $ = id => document.getElementById(id);

  if($('tabJ')) $('tabJ').onclick = () => { state.tab='jugador'; state.editing=false; state.err=''; render(); };
  if($('tabE')) $('tabE').onclick = () => { state.tab='entrenador'; state.err=''; render(); };
  if($('back')) $('back').onclick = () => { state.tab='jugador'; state.err=''; render(); };

  document.querySelectorAll('[data-cond]').forEach(b => {
    b.onclick = () => { state.match = {...state.match, condicion:b.getAttribute('data-cond')}; render(); };
  });
  if($('toggleEdit')) $('toggleEdit').onclick = () => { state.editing = !state.editing; render(); };
  if($('saveHeader')) $('saveHeader').onclick = () => saveMatch({
    condicion: state.match.condicion,
    lugar: $('fLugar').value.trim(),
    participan: $('fPart').value.trim(),
    fecha: $('fFecha').value || state.match.fecha,
    hora: $('fHora').value || ''
  });

  if($('who')) $('who').onchange = async e => {
    const v = e.target.value;
    if(v === '__new__'){ state.showNew = true; render(); return; }
    if(!v) return;
    state.myId = v;
    await store.setMine('my_id', v);
    const r = state.responses[v];
    state.draft = r ? r.status : null;
    state.draftMotivo = r ? r.motivo : null;
    state.showNew = false;
    render();
  };
  if($('showAll')) $('showAll').onclick = () => { state.showAll = true; render(); };
  if($('showPend')) $('showPend').onclick = () => { state.showAll = false; render(); };

  if($('addMe')) $('addMe').onclick = async () => {
    const n = $('nName').value.trim(), a = $('nSur').value.trim(), k = $('nNick').value.trim();
    if(!n || !a) return;
    const p = {n, a, k};
    if(!state.roster.some(x => pid(x) === pid(p))){ state.roster.push(p); await saveRoster(); }
    state.myId = pid(p);
    await store.setMine('my_id', state.myId);
    state.draft = null; state.draftMotivo = null; state.showNew = false;
    render();
  };
  if($('notMe')) $('notMe').onclick = async () => {
    state.myId = ''; state.draft = null; state.draftMotivo = null;
    await store.setMine('my_id', '');
    render();
  };

  if($('bVa')) $('bVa').onclick = () => { state.draft='va'; state.draftMotivo=null; render(); };
  if($('bNo')) $('bNo').onclick = () => { state.draft='no'; render(); };
  document.querySelectorAll('[data-mot]').forEach(c => {
    c.onclick = () => { state.draftMotivo = c.getAttribute('data-mot'); render(); };
  });
  if($('send')) $('send').onclick = submitResponse;
  if($('changeAns')) $('changeAns').onclick = () => {
    const r = state.responses[state.myId];
    state.draft = r ? r.status : null;
    state.draftMotivo = r ? r.motivo : null;
    state.editingAnswer = true;
    render();
  };
  if($('cancelAns')) $('cancelAns').onclick = () => { state.editingAnswer = false; render(); };
  if($('doneAns')) $('doneAns').onclick = () => {
    state.myId = ''; state.draft = null; state.draftMotivo = null;
    state.editingAnswer = false; state.showAll = false;
    render();
  };

  if($('setPass')) $('setPass').onclick = async () => {
    const a = $('p1').value.trim(), b = $('p2').value.trim();
    if(a.length < 4){ state.err='La clave debe tener al menos 4 caracteres.'; render(); return; }
    if(a !== b){ state.err='Las claves no coinciden.'; render(); return; }
    state.pass = a; await store.set('coach_pass', a);
    state.authed = true; state.err=''; render();
  };
  if($('checkPass')) $('checkPass').onclick = () => {
    if($('pIn').value.trim() === state.pass){ state.authed=true; state.err=''; }
    else state.err='Clave incorrecta.';
    render();
  };
  if($('pIn')) $('pIn').onkeydown = e => { if(e.key==='Enter') $('checkPass').click(); };

  if($('togglePass')) $('togglePass').onclick = () => { state.changingPass=!state.changingPass; state.err=''; render(); };
  if($('toggleTeamPass')) $('toggleTeamPass').onclick = () => { state.changingTeamPass=!state.changingTeamPass; state.teamErr=''; render(); };
  if($('savePass')) $('savePass').onclick = async () => {
    const a = $('np1').value.trim(), b = $('np2').value.trim();
    if(a.length < 4){ state.err='La clave debe tener al menos 4 caracteres.'; render(); return; }
    if(a !== b){ state.err='Las claves no coinciden.'; render(); return; }
    state.pass = a; await store.set('coach_pass', a);
    state.changingPass=false; state.err=''; render();
  };
  if($('checkTeam')) $('checkTeam').onclick = () => {
    if($('tIn').value.trim() === state.teamPass){ state.teamAuthed=true; state.teamErr=''; }
    else state.teamErr='Clave incorrecta.';
    render();
  };
  if($('tIn')) $('tIn').onkeydown = e => { if(e.key==='Enter') $('checkTeam').click(); };

  if($('saveTeamPass')) $('saveTeamPass').onclick = async () => {
    const a = $('tp1').value.trim(), b = $('tp2').value.trim();
    if(a.length < 4){ state.teamErr='La clave debe tener al menos 4 caracteres.'; render(); return; }
    if(a !== b){ state.teamErr='Las claves no coinciden.'; render(); return; }
    state.teamPass = a; await store.set('team_pass', a);
    state.teamAuthed = true; state.teamErr=''; state.changingTeamPass=false; render();
  };
  if($('clearTeamPass')) $('clearTeamPass').onclick = async () => {
    state.teamPass = null; await store.set('team_pass', '');
    state.teamAuthed = false; state.teamErr=''; render();
  };

  if($('lock')) $('lock').onclick = () => { state.authed=false; state.changingPass=false; state.editing=false; render(); };

  if($('nuevoEnc')) $('nuevoEnc').onclick = () => { state.confirmNuevo = true; render(); };
  if($('nuevoNo')) $('nuevoNo').onclick = () => { state.confirmNuevo = false; render(); };
  if($('nuevoSi')) $('nuevoSi').onclick = nuevoEncuentro;

  if($('addP')) $('addP').onclick = async () => {
    const n = $('aName').value.trim(), a = $('aSur').value.trim(), k = $('aNick').value.trim();
    if(!n || !a) return;
    const p = {n, a, k};
    if(!state.roster.some(x => pid(x) === pid(p))){ state.roster.push(p); await saveRoster(); }
    render();
  };
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => {
      const id = b.getAttribute('data-del');
      state.roster = state.roster.filter(p => pid(p) !== id);
      await saveRoster(); render();
    };
  });

  if($('copyRem')) $('copyRem').onclick = async () => {
    const ok = await copyText(buildReminder());
    const btn = $('copyRem');
    btn.textContent = ok ? 'Copiado ✓' : 'No se pudo copiar';
    setTimeout(() => { const b2 = document.getElementById('copyRem'); if(b2) b2.textContent = 'Copiar recordatorio'; }, 1800);
  };
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- auto-sincronización ---------- */
let syncTimer = null;

async function syncFromDB(){
  if(!ONLINE || state.loading) return;
  // no pisar lo que el usuario está tipeando
  if(state.editing || state.changingPass || state.changingTeamPass || state.editingAnswer) return;

  const rosterSnapshot = JSON.stringify(state.roster);
  const matchSnapshot = JSON.stringify(state.match);

  try{
    let m = await store.get('match');
    if(m && typeof m === 'string'){ try{ m = JSON.parse(m); }catch(e){ m = null; } }
    if(m && m.matchId) state.match = m;

    let ros = await store.get('roster');
    if(ros && typeof ros === 'string'){ try{ ros = JSON.parse(ros); }catch(e){ ros = null; } }
    ros = migrateRoster(ros);
    if(Array.isArray(ros) && ros.length) state.roster = sortRoster(ros);

    let resp = await store.get('responses:'+state.match.matchId);
    if(resp && typeof resp === 'string'){ try{ resp = JSON.parse(resp); }catch(e){ resp = null; } }
    const fresh = (resp && typeof resp === 'object') ? resp : {};

    // solo redibujar si algo cambió, para no interrumpir al usuario
    const changed = JSON.stringify(fresh) !== JSON.stringify(state.responses)
                 || JSON.stringify(state.roster) !== rosterSnapshot
                 || JSON.stringify(state.match) !== matchSnapshot;
    state.responses = fresh;
    if(changed) render();
  }catch(e){ /* silencioso: si falla, reintenta en el próximo ciclo */ }
}

function startSync(){
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(syncFromDB, 20000);
}

// volver a la app tras minimizarla trae los datos al instante
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') syncFromDB();
});

loadAll().then(startSync);
</script>
